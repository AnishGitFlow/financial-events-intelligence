name: Daily Financial Events Monitor

on:
  schedule:
    # Runs every day at 7:00 AM IST
    - cron: '30 1 * * *'

  workflow_dispatch:

concurrency:
  group: financial-events-monitor
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      # -------------------------------------------------------------------
      # Checkout Repository
      # -------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Setup Python
      # -------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # -------------------------------------------------------------------
      # Install Dependencies
      # -------------------------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------------------------
      # Ensure Required Directories Exist
      # -------------------------------------------------------------------
      - name: Create Required Directories
        run: |
          mkdir -p data/reports

      # -------------------------------------------------------------------
      # Ensure history.json Exists
      # -------------------------------------------------------------------
      - name: Initialize Deduplication History
        run: |
          if [ ! -f data/history.json ]; then
            echo '{"events": {}}' > data/history.json
          fi

      # -------------------------------------------------------------------
      # Create .env File from GitHub Secrets
      # -------------------------------------------------------------------
      - name: Create .env File
        run: |
          echo "SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}" >> .env

          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env

          echo "REPORT_TO=${{ secrets.REPORT_TO }}" >> .env
          echo "REPORT_FROM=${{ secrets.REPORT_FROM }}" >> .env

      # -------------------------------------------------------------------
      # Run Diagnostics
      # -------------------------------------------------------------------
      - name: Run Diagnostic Tests
        run: |
          python test_pipeline.py || echo "Diagnostics completed"

      # -------------------------------------------------------------------
      # Execute Main Pipeline
      # -------------------------------------------------------------------
      - name: Run Financial Intelligence Pipeline
        run: |
          python main.py

      # -------------------------------------------------------------------
      # Upload Reports and Outputs
      # -------------------------------------------------------------------
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: financial-event-reports
          path: |
            data/reports/
            data/history.json

      # -------------------------------------------------------------------
      # Persist Updated Deduplication History
      # -------------------------------------------------------------------
      - name: Commit Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/history.json

          if git diff --cached --quiet; then
            echo "No history changes detected"
          else
            git commit -m "Update event history [skip ci]"
            git push
          fi

      # -------------------------------------------------------------------
      # Final Status
      # -------------------------------------------------------------------
      - name: Workflow Summary
        run: |
          echo "Daily Financial Events Monitor completed successfully."
